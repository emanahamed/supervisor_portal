{% extends 'auth/_auth_base.html' %} {% block title %}Sign in — Excel Tutors{%
endblock %} {% block auth_content %}
<h1
  class="text-2xl font-semibold bg-gradient-to-r from-white to-indigo-100 bg-clip-text text-transparent mb-6"
>
  Welcome back
</h1>
<form method="post" class="space-y-5">
  {{ form.hidden_tag() }}
  <div>
    <label
      class="block text-xs font-semibold tracking-wide text-white/80 mb-1 uppercase"
      >Email</label
    >
    {{ form.email(class_='soft-input') }}
  </div>
  <div>
    <label
      class="block text-xs font-semibold tracking-wide text-white/80 mb-1 uppercase"
      >Password</label
    >
    {{ form.password(class_='soft-input') }}
  </div>
  <button class="primary-btn">Sign in</button>
  <div class="flex items-center justify-between text-xs mt-2">
    <a href="{{ url_for('request_reset') }}" class="link">Forgot password?</a>
    <a href="{{ url_for('register') }}" class="text-white/70 hover:text-white"
      >Create account →</a
    >
  </div>
</form>
{% endblock %}
