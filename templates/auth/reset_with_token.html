{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto soft-card p-6">
  <h1 class="text-xl font-semibold mb-4">Set new password</h1>
  <form method="post">
    <label class="block text-sm mb-1">New password</label>
    <input name="password" type="password" class="soft-input mb-3" required>
    <button class="soft-btn soft-btn-primary w-full">Update password</button>
  </form>
</div>
{% endblock %}
