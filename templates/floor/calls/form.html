<form method="post" action="{{ url_for('floor_call_list_edit', cid=record.id) if record else url_for('floor_call_list_new') }}"
  x-data="{
    reason: '{{ record.reason if record else 'absence' }}',
    dayName: '',
    studentQuery: '',
    init(){ this.updateDay(); },
    updateDay(){
      const iso = this.$refs.dateInput?.value || '';
      if(!iso){ this.dayName=''; return; }
      const [y,m,d] = iso.split('-').map(Number);
      if(!y||!m||!d){ this.dayName=''; return; }
      const wk=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      this.dayName = wk[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
    },
    filterStudents(){ /* reserved for future local filter */ }
  }" x-init="init()">
  <input type="hidden" name="csrf_token" value="{{ CSRF_TOKEN }}" />
  <div class="space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div
        x-data="{
          query: '{{ (record.student.student_id ~ ' — ' ~ record.student.name)|e if record and record.student else '' }}',
          results: [],
          open: false,
          hover: 0,
          activeLabel: '',
          selectedId: {{ record.student_id if record and record.student_id else 0 }},
          _debounced: null,
          _debounce(fn, wait){ let t; return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); } },
          fetch(){ if(!this._debounced){ this._debounced=this._debounce((v)=>this._do(v), 180);} const q=(this.query||'').trim(); this.selectedId=0; this.$refs.sid.value=0; if(!q){ this.results=[]; this.open=false; this.activeLabel=''; return; } this._debounced(q); },
          async _do(q){ try{ const r=await fetch('/api/students/suggest?q='+encodeURIComponent(q)); const arr=await r.json(); this.results=Array.isArray(arr)?arr:[]; this.open=!!this.results.length; this.hover=0; this.activeLabel=(this.results[0]?.label)||''; }catch(e){ this.results=[]; this.open=false; this.activeLabel=''; } },
          highlight(dir){ if(!this.open||!this.results.length) return; this.hover=(this.hover+dir+this.results.length)%this.results.length; this.activeLabel=this.results[this.hover]?.label||''; },
          chooseActive(){ if(this.results[this.hover]) this.choose(this.results[this.hover]); },
          choose(r){ this.query=r.label; this.activeLabel=r.label; this.open=false; this.selectedId=r.id||0; this.$refs.sid.value=this.selectedId; }
        }"
        class="relative"
        @click.outside="open=false"
      >
        <label class="block text-xs font-medium mb-1">Student</label>
        <input type="hidden" name="student_id" x-ref="sid" value="{{ record.student_id if record else 0 }}" />
        <input type="text" name="student_name" x-model="query" @input="fetch()" @keydown.down.prevent="highlight(1)" @keydown.up.prevent="highlight(-1)" @keydown.enter.prevent="chooseActive()" placeholder="Type ID or name" class="soft-input pr-10" autocomplete="off" />
        <template x-if="activeLabel"><div class="absolute inset-y-0 right-2 flex items-center text-[10px] text-slate-400" x-text="activeLabel"></div></template>
        <div x-show="open" x-cloak class="absolute z-20 mt-1 w-full max-h-56 overflow-auto bg-white dark:bg-[#151515] border border-slate-200 dark:border-slate-700 rounded-md shadow-lg text-xs">
          <template x-for="(r,i) in results" :key="r.id">
            <div @click="choose(r)" @mouseenter="hover=i" :class="['px-3 py-1 cursor-pointer flex justify-between gap-2', i===hover ? 'bg-indigo-50 dark:bg-slate-700' : '']">
              <span x-text="r.label"></span>
              <span class="text-slate-400" x-text="r.student_id"></span>
            </div>
          </template>
          <template x-if="!results.length">
            <div class="px-3 py-2 text-slate-500">No matches…</div>
          </template>
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Reason</label>
        <select name="reason" class="soft-input" x-model="reason" @change="$dispatch('reason-changed', reason)" required>
          {% for r in reasons %}
          <option value="{{ r }}" {% if record and record.reason==r %}selected{% endif %}>{{ r.title() }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Date</label>
        <input type="date" class="soft-input" name="date" x-ref="dateInput" @input="updateDay()" @change="updateDay()" value="{{ (record.date.isoformat() if record and record.date else (today.isoformat() if today else '')) }}">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Day</label>
        <input type="text" class="soft-input" :value="dayName || '{{ record.day if record else '' }}'" disabled>
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium mb-1">Discussion</label>
  <textarea name="discussion" rows="3" class="soft-input" required>{{ record.discussion if record else '' }}</textarea>
    </div>
    <div>
      <label class="block text-xs font-medium mb-1">Outcome (optional)</label>
      <textarea name="outcome" rows="2" class="soft-input">{{ record.outcome if record else '' }}</textarea>
    </div>

    <!-- Meeting-specific fields -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3" x-show="reason==='meeting'" x-cloak>
      <div>
        <label class="block text-xs font-medium mb-1">Appointment date</label>
        <input type="date" class="soft-input" name="appointment_date" value="{{ record.appointment_date.isoformat() if record and record.appointment_date else '' }}">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Appointment with</label>
        <select name="appointment_with_id" class="soft-input">
          <option value="">Select staff</option>
          {% for u in staff_opts %}
          <option value="{{ u.id }}" {% if record and record.appointment_with_id==u.id %}selected{% endif %}>{{ u.name }} ({{ u.role }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Event-specific field -->
  <div x-show="reason==='event'" x-cloak>
      <label class="block text-xs font-medium mb-1">Will the student attend the event?</label>
      {% set opts = [('yes','Yes'),('no','No'),('unsure','Unsure')] %}
      <div class="flex flex-wrap gap-3">
        {% for key, lbl in opts %}
        <label class="inline-flex items-center gap-2 text-sm">
          <input type="radio" name="event_attendance" value="{{ key }}" class="soft-radio" {% if record and record.event_attendance==key %}checked{% endif %}> {{ lbl }}
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="mt-3 flex items-center justify-end gap-2">
      <button type="submit" class="soft-btn primary">Save</button>
    </div>
  </div>
</form>

<!-- No inline script needed; x-data is defined as an inline object above for Alpine to evaluate safely -->
