{# Modal-friendly form partial for Create/Edit Supervisor Shift #}
<form method="post" x-data="{ dayName: '', init() { this.updateDay(); }, updateDay() { let txt = this.$refs.dateInput?.value?.trim() || ''; let d=null, mo=null, y=null; const iso = txt.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso){ y = Number(iso[1]); mo = Number(iso[2]); d = Number(iso[3]); } else { const m = txt.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); if(m){ d = Number(m[1]); mo = Number(m[2]); y = Number(m[3]); } } if(!d||!mo||!y){ this.dayName=''; return; } const wk=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const idx=new Date(Date.UTC(y,mo-1,d)).getUTCDay(); this.dayName = wk[idx]; } }" x-init="init()">
  <input type="hidden" name="csrf_token" value="{{ CSRF_TOKEN }}" />
  <div class="space-y-3">
    <div>
      <label class="block text-xs font-medium mb-1">Staff</label>
      <select name="staff_user_id" class="soft-input" required>
        <option value="">Select staff</option>
        {% for u in staff_list %}
        <option value="{{ u.id }}" {% if record and record.staff_user_id == u.id %}selected{% endif %}>{{ u.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-medium mb-1">Date</label>
  <input name="date" type="date" value="{{ record.date.strftime('%Y-%m-%d') if record else '' }}" class="soft-input" required x-ref="dateInput" @input="updateDay()" @change="updateDay()" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Day</label>
        <input type="text" class="soft-input" :value="dayName || '{{ record.day if record else '' }}'" disabled />
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium mb-1">Timeslots</label>
      <div class="flex flex-wrap gap-2">
        {% for t in TIMESLOT_OPTIONS %}
        {% set checked = (t in (record.timeslots.split(',') if record and record.timeslots else [])) %}
        <label class="inline-flex items-center gap-1 text-xs">
          <input type="checkbox" name="timeslots" value="{{ t }}" {% if checked %}checked{% endif %}>
          <span>{{ t }}</span>
        </label>
        {% endfor %}
      </div>
      <p class="text-[11px] text-gray-400 mt-1">Weekdays default to 5-7 if none selected (can be changed).</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-medium mb-1">Branch</label>
        <select name="branch" class="soft-input">
          <option value="">Select branch</option>
          {% for b in branch_choices %}
          <option value="{{ b }}" {% if record and record.branch == b %}selected{% endif %}>{{ b }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Notes (optional)</label>
        <input type="text" name="notes" class="soft-input" value="{{ record.notes if record else '' }}" />
      </div>
    </div>
  </div>
  <div class="mt-4 flex items-center justify-end gap-2">
    <a href="{{ url_for('supervisor_shifts_index') }}" class="soft-btn">Cancel</a>
    <button type="submit" class="soft-btn primary">Save</button>
  </div>
</form>
