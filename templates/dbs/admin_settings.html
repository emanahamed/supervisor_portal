{% extends "base.html" %}
{% block title %}DBS Settings{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-8 px-4">
  <div class="mb-6">
    <a href="{{ url_for('dbs.admin_dbs_list') }}" class="text-sm text-gray-500 dark:text-gray-400 hover:text-brand-indigo inline-flex items-center gap-1 mb-1">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to list
    </a>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">DBS Fee Settings</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Configure the fee charged for Enhanced DBS applications.</p>
  </div>

  <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">DBS Application Fee (£)</label>
      <input type="number" name="dbs_fee" step="0.01" min="0" value="{{ "%.2f"|format(fee) }}" required class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:ring-brand-indigo focus:border-brand-indigo">
      <p class="text-xs text-gray-500 mt-1">This amount will be charged via Stripe when applicants submit their DBS form.</p>
    </div>
    <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 bg-brand-indigo text-white font-medium rounded-lg hover:bg-brand-indigo-800 transition-colors">
      Save Settings
    </button>
  </form>
</div>
{% endblock %}
