{% extends "base.html" %}
{% block title %}Export DBS Applications{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-8 px-4">
  <div class="mb-6">
    <a href="{{ url_for('dbs.admin_dbs_list') }}" class="text-sm text-gray-500 dark:text-gray-400 hover:text-brand-indigo inline-flex items-center gap-1 mb-1">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to list
    </a>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Export DBS Applications</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Select the fields you want to include in the Excel export.</p>
  </div>

  <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-4 flex gap-3">
      <button type="button" onclick="document.querySelectorAll('input[name=fields]').forEach(cb => cb.checked = true)" class="text-xs text-brand-indigo hover:underline">Select All</button>
      <button type="button" onclick="document.querySelectorAll('input[name=fields]').forEach(cb => cb.checked = false)" class="text-xs text-gray-500 hover:underline">Deselect All</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      {% for key, label in exportable_fields.items() %}
      <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/30 cursor-pointer">
        <input type="checkbox" name="fields" value="{{ key }}" checked class="rounded text-brand-indigo focus:ring-brand-indigo">
        <span class="text-sm text-gray-700 dark:text-gray-300">{{ label }}</span>
      </label>
      {% endfor %}
    </div>

    <div class="mt-6 flex justify-end">
      <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 bg-brand-indigo text-white font-medium rounded-lg hover:bg-brand-indigo-800 transition-colors">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
        Export to XLSX
      </button>
    </div>
  </form>
</div>
{% endblock %}
