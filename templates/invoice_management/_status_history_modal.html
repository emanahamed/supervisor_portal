<div
  id="statusHistoryModal"
  class="fixed inset-0 hidden items-start md:items-center justify-center z-50 p-4 md:p-8"
>
  <div class="absolute inset-0 bg-slate-900/60" data-h-close></div>
  <div
    class="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden"
  >
    <div class="px-5 py-3 border-b flex items-center gap-3">
      <div>
        <h3
          class="font-semibold text-sm tracking-wide uppercase text-slate-600"
        >
          Invoice History
        </h3>
        <div class="text-[11px] text-slate-400" id="historyInvoiceLabel"></div>
      </div>
      <div class="ml-auto">
        <button
          class="text-slate-500 hover:text-slate-700"
          data-h-close
          aria-label="Close history"
        >
          ✕
        </button>
      </div>
    </div>
    <div class="flex flex-1 min-h-0">
      <aside
        class="hidden md:block w-56 border-r overflow-y-auto text-xs p-3 bg-slate-50"
        id="historyIndex"
      >
        <div
          class="text-[10px] font-semibold text-slate-500 mb-2 uppercase tracking-wide"
        >
          Events
        </div>
        <!-- list of events will be populated here -->
      </aside>
      <div
        class="flex-1 overflow-y-auto p-4 text-sm leading-relaxed"
        id="historyBody"
      >
        <div class="animate-pulse text-slate-400">Loading history…</div>
      </div>
    </div>
    <div
      class="px-5 py-3 border-t flex justify-between items-center text-[12px] text-slate-400"
    >
      <div class="hidden md:block">
        Tip: Click an event to jump · Esc to close
      </div>
      <div class="flex gap-2">
        <button
          class="px-3 py-1 rounded bg-slate-100 hover:bg-slate-200 text-xs"
          data-h-close
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>
